name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Zero-install selector smoke test
        run: python run_selector.py --input data/sample_markets.json
      - name: Tests
        run: pytest tests -q --strict-markers
